services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: feira-marketplace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: feira_marketplace
      POSTGRES_USER: feira_admin
      POSTGRES_PASSWORD: feira_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: